<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureum — หุ้นไทย Dashboard</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  main { max-width: none; grid-template-columns: 1fr 320px; align-items: start; }
  #symbol-select {
    background: oklch(0.14 0.006 250); border: 1px solid oklch(0.29 0.008 250); color: oklch(0.92 0.004 250);
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; min-width: 220px;
  }
  .caveat {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: oklch(0.78 0.15 70 / 0.10); border: 1px solid oklch(0.78 0.15 70 / 0.25);
    border-radius: 8px; font-size: 11.5px; color: oklch(0.78 0.15 70);
  }
  .chart-card { display: flex; flex-direction: column; min-height: 460px; }
  #chart-container { flex: 1; min-height: 380px; }
</style>
</head>
<body data-active="stock-dashboard">
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div class="topbar">
        <span style="font-size:14.5px; font-weight:700;">หุ้นไทย · Dashboard</span>
        <select id="symbol-select"></select>
        <div class="tf-tabs" id="tf-tabs">
          <button data-tf="M15">M15</button>
          <button data-tf="H1">H1</button>
          <button data-tf="H4">H4</button>
          <button data-tf="D1" class="active">D1</button>
          <button data-tf="W1">W1</button>
        </div>
      </div>
      <main>
        <section class="card ai-summary" id="ai-summary">
          <div class="ai-summary-head">
            <span class="ai-avatar">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="7" width="16" height="13" rx="5" stroke="oklch(0.75 0.14 85)" stroke-width="1.8"/>
                <circle cx="9" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
                <circle cx="15" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
                <path d="M9.5 16.3 Q12 18 14.5 16.3" stroke="oklch(0.75 0.14 85)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <path d="M12 7 V4" stroke="oklch(0.75 0.14 85)" stroke-width="1.7" stroke-linecap="round"/>
                <circle cx="12" cy="3" r="1.2" fill="oklch(0.75 0.14 85)"/>
              </svg>
            </span>
            <h2>หุ้นที่น่าจับตาวันนี้</h2>
            <span class="market-status" id="set-market-status"></span>
            <span class="ai-summary-ts mono" id="ai-summary-ts"></span>
            <button class="ai-refresh" id="ai-summary-refresh" aria-label="รีเฟรชสรุป">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8 8 0 1 0 18.6 16 M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="digest-stats" id="ai-summary-stats"></div>
          <div id="ai-summary-stocks">กำลังโหลด…</div>
          <div class="digest-chips" id="ai-summary-chips"></div>
        </section>

        <div class="caveat">
          <span class="dot" style="width:6px;height:6px;border-radius:50%;background:oklch(0.78 0.15 70);"></span>
          ข้อมูลทดสอบจาก Yahoo Finance (unofficial) — เคยมีรายงานราคา .BK ผิดปกติ ควรเช็คความแม่นยำก่อนใช้งานจริง ไม่ใช่แหล่งข้อมูลสำหรับ production
        </div>

        <section class="chart-card card">
          <div style="display:flex; align-items:baseline; gap:14px; margin-bottom:10px;">
            <span class="label" id="symbol-label" style="margin:0;">–</span>
            <span class="price mono" id="price" style="font-size:22px;">–</span>
            <span class="mono" id="change" style="font-size:13px; font-weight:600;"></span>
          </div>
          <div id="updated" style="margin-bottom:10px;">กำลังโหลด…</div>
          <div id="chart-container"></div>
        </section>

        <section class="sr-card card">
          <div class="label">แนวสำคัญใกล้ราคา</div>
          <div id="sr-list">กำลังโหลด…</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script src="/chat-fab.js"></script>
  <script src="/market-hours.js"></script>
  <script src="/candlestick-chart.js"></script>
  <script src="/stock-dashboard.js"></script>
</body>
</html>
