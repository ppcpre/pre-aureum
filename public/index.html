<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-AUREUM — ทอง Dashboard</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  main { max-width: none; grid-template-columns: 1fr 320px; align-items: start; }
  .chart-card { display: flex; flex-direction: column; min-height: 460px; }
  #chart-container { flex: 1; min-height: 380px; }
  .chart-card, .sr-card { grid-column: 1 / -1; }
  /* Row 1: summary + signal side by side — override the shared full-width rule just on this page. */
  .ai-summary { grid-column: auto; }

  /* Buy/sell/hold signal card (row 1, right) */
  .signal-card { display: flex; flex-direction: column; }
  .signal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .signal-head .label { font-size: 13px; font-weight: 700; margin: 0; }
  .signal-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800;
    padding: 4px 11px; border-radius: 20px; margin-left: auto; flex-shrink: 0;
  }
  .signal-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  .signal-badge.hold { color: oklch(0.78 0.15 70); background: oklch(0.78 0.15 70 / 0.15); }
  .signal-badge.buy { color: oklch(0.72 0.15 150); background: oklch(0.72 0.15 150 / 0.15); }
  .signal-badge.sell { color: oklch(0.65 0.18 25); background: oklch(0.65 0.18 25 / 0.15); }
  .tf-signal-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .tf-chip {
    flex: 1; min-width: 44px; text-align: center; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10.5px; font-weight: 700; padding: 8px 0; border-radius: 6px;
  }
  .tf-chip.buy { color: oklch(0.72 0.15 150); background: oklch(0.72 0.15 150 / 0.16); }
  .tf-chip.sell { color: oklch(0.65 0.18 25); background: oklch(0.65 0.18 25 / 0.16); }
  .tf-chip.hold { color: oklch(0.78 0.15 70); background: oklch(0.78 0.15 70 / 0.16); }
  .tf-chip.na { color: oklch(0.55 0.01 250); background: oklch(0.22 0.007 250); }

  /* RSI(14) pill next to price/change — chart-card header */
  .rsi-pill {
    display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    color: oklch(0.60 0.01 250); background: oklch(0.29 0.008 250);
  }
  .rsi-pill.overbought { color: oklch(0.65 0.18 25); background: oklch(0.65 0.18 25 / 0.14); }
  .rsi-pill.oversold { color: oklch(0.72 0.15 150); background: oklch(0.72 0.15 150 / 0.14); }

  /* S/R tile grid (row 3), replacing the old .sr-row list on this page */
  .sr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sr-tile { background: oklch(0.22 0.007 250); border-radius: 8px; padding: 12px 12px; text-align: center; }
  .sr-tile.resistance { border: 1px solid oklch(0.65 0.18 25 / 0.35); }
  .sr-tile.support { border: 1px solid oklch(0.72 0.15 150 / 0.35); }
  .sr-tile .p { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 700; }
  .sr-tile.resistance .p { color: oklch(0.65 0.18 25); }
  .sr-tile.support .p { color: oklch(0.72 0.15 150); }
  .sr-tile .l { font-size: 10.5px; color: oklch(0.55 0.01 250); margin-top: 4px; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .ai-summary { grid-column: 1 / -1; }
  }
  @media (max-width: 640px) {
    .sr-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body data-active="gold-dashboard">
  <div class="app-shell">
    <div id="sidebar-mount"></div>

    <div class="main-col">
      <div class="topbar">
        <span style="font-size:14.5px; font-weight:700;">ทอง · XAU/USD</span>
        <div class="tf-tabs" id="tf-tabs">
          <button data-tf="M15">M15</button>
          <button data-tf="H1">H1</button>
          <button data-tf="H4" class="active">H4</button>
          <button data-tf="D1">D1</button>
          <button data-tf="W1">W1</button>
        </div>
      </div>

      <main>
        <section class="card ai-summary" id="ai-summary">
          <div class="ai-summary-head">
            <span class="ai-avatar">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                <rect x="4" y="7" width="16" height="13" rx="5" stroke="oklch(0.75 0.14 85)" stroke-width="1.8"/>
                <circle cx="9" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
                <circle cx="15" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
                <path d="M9.5 16.3 Q12 18 14.5 16.3" stroke="oklch(0.75 0.14 85)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <path d="M12 7 V4" stroke="oklch(0.75 0.14 85)" stroke-width="1.7" stroke-linecap="round"/>
                <circle cx="12" cy="3" r="1.2" fill="oklch(0.75 0.14 85)"/>
              </svg>
            </span>
            <h2>สรุปทองประจำวัน</h2>
            <span class="market-status" id="gold-market-status"></span>
            <span id="gold-holiday-notice" hidden></span>
            <span class="ai-summary-ts mono" id="ai-summary-ts"></span>
            <button class="ai-refresh" id="ai-summary-refresh" aria-label="รีเฟรชสรุป">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8 8 0 1 0 18.6 16 M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="digest-sub" id="ai-summary-sub">กำลังโหลด…</p>
          <div class="digest-stats" id="ai-summary-stats"></div>
          <div class="digest-chips" id="ai-summary-chips"></div>
        </section>

        <section class="card signal-card" id="signal-card">
          <div class="signal-head">
            <span class="label">สัญญาณซื้อ-ขาย</span>
            <span class="signal-badge hold" id="signal-badge"><span class="dot"></span><span id="signal-badge-text">รอดู</span></span>
          </div>
          <div class="tf-signal-row" id="tf-signal-row">
            <span class="tf-chip na">M15</span>
            <span class="tf-chip na">H1</span>
            <span class="tf-chip na">H4</span>
            <span class="tf-chip na">D1</span>
            <span class="tf-chip na">W1</span>
          </div>
        </section>

        <section class="chart-card card">
          <div class="stale-banner" id="stale-banner">
            <span>⏸ หยุดอัปเดตอัตโนมัติแล้ว (เปิดหน้านี้ค้างไว้เกิน 5 นาที) — ราคาที่เห็นอาจไม่ทันปัจจุบัน</span>
            <button id="stale-refresh-btn">รีเฟรช</button>
          </div>
          <div style="display:flex; align-items:center; gap:14px; margin-bottom:10px;">
            <span class="label" style="margin:0;">XAU/USD</span>
            <span class="price mono" id="price" style="font-size:22px;">–</span>
            <span class="mono" id="change" style="font-size:13px; font-weight:600;"></span>
            <span class="rsi-pill" id="rsi-pill" hidden></span>
            <button class="ai-refresh" id="chart-refresh" aria-label="รีเฟรชราคา" style="margin-left:auto;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8 8 0 1 0 18.6 16 M20 5v6h-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div id="updated" style="margin-bottom:10px;">กำลังโหลด…</div>
          <div id="chart-container"></div>
        </section>

        <section class="sr-card card">
          <div class="label">แนวสำคัญใกล้ราคา</div>
          <div class="sr-grid" id="sr-list">กำลังโหลด…</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script src="/chat-fab.js"></script>
  <script src="/market-hours.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/candlestick-chart.js"></script>
  <script src="/app.js"></script>
</body>
</html>
