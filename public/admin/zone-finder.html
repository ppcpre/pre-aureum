<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureum Admin — Zone Finder (ทอง)</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  #logout { background:none; border:1px solid oklch(0.29 0.008 250); color:inherit; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:12.5px; }
  .bias-badge { font-size: 22px; font-weight: 800; }
  .bias-badge.bullish { color: oklch(0.72 0.15 150); }
  .bias-badge.bearish { color: oklch(0.65 0.18 25); }
  .bias-badge.neutral { color: oklch(0.78 0.15 70); }
  .checklist-item { display:flex; gap:10px; padding:10px 0; border-top:1px solid oklch(0.26 0.008 250); }
  .checklist-item:first-child { border-top: none; }
  .status-icon { font-family: 'IBM Plex Mono', monospace; font-weight:700; width:18px; flex-shrink:0; }
  .status-pass .status-icon { color: oklch(0.72 0.15 150); }
  .status-fail .status-icon { color: oklch(0.65 0.18 25); }
  .status-pending .status-icon { color: oklch(0.78 0.15 70); }
  .zones-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
  .zone-tile { padding:12px; border-radius:8px; background: oklch(0.14 0.006 250); }
  .zone-tile .zone-label { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; }
  .zone-tile .zone-value { font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:700; margin-top:6px; }
</style>
</head>
<body data-active="admin-zone-finder">
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div class="topbar">
        <span style="font-size:14.5px; font-weight:700;">🔒 Admin · Entry/Exit Zone Finder — ทอง</span>
        <button id="logout">ออกจากระบบ</button>
      </div>

      <main>
        <section class="card">
          <div class="label">Bias ปัจจุบัน</div>
          <div class="bias-badge" id="bias">กำลังโหลด…</div>
          <div class="muted" id="score"></div>
        </section>

        <section class="card">
          <div class="label">Confluence Checklist</div>
          <div id="checklist">กำลังโหลด…</div>
        </section>

        <section class="card">
          <div class="label">โซนที่แนะนำพิจารณา</div>
          <div class="zones-grid" id="zones"></div>
        </section>

        <div class="muted" style="text-align:center; padding: 8px 0;">
          เครื่องมือช่วยวิเคราะห์ ไม่ใช่คำแนะนำการลงทุน
        </div>
      </main>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script src="/chat-fab.js"></script>
  <script src="/admin/common.js"></script>
  <script src="/admin/zone-finder.js"></script>
</body>
</html>
