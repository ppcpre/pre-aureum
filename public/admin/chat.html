<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aureum Admin — AI Chat</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  body, .app-shell { height: 100vh; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 !important; }
  #logout, #usage-toggle, #clear-btn {
    background: none; border: 1px solid oklch(0.29 0.008 250); color: inherit;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12.5px;
  }
  .topbar-title { display: flex; align-items: center; gap: 9px; font-size: 14.5px; font-weight: 700; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }

  #usage-panel {
    position: absolute; top: 56px; right: 20px; width: 320px; z-index: 10;
    padding: 18px; display: none;
  }
  #usage-panel.open { display: block; }
  .usage-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12.5px; }
  .usage-section-label { font-size: 11px; font-weight: 700; color: oklch(0.60 0.01 250); text-transform: uppercase; letter-spacing: 0.4px; margin: 10px 0 4px; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }

  .msg-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-row.user { flex-direction: row-reverse; }

  .ai-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: oklch(0.75 0.14 85 / 0.14); border: 1px solid oklch(0.75 0.14 85 / 0.35);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-avatar.thinking svg { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

  .msg { max-width: 620px; padding: 12px 15px; border-radius: 12px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; }
  .msg.user { background: oklch(0.75 0.14 85 / 0.14); border: 1px solid oklch(0.75 0.14 85 / 0.3); border-bottom-right-radius: 3px; }
  .msg.assistant { background: oklch(0.20 0.007 250); border: 1px solid oklch(0.29 0.008 250); border-bottom-left-radius: 3px; }

  .thinking-card {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 15px; border-radius: 12px;
    border-bottom-left-radius: 3px; background: oklch(0.20 0.007 250); border: 1px solid oklch(0.29 0.008 250);
    min-width: 220px;
  }
  .thinking-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .thinking-label { font-size: 12.5px; color: oklch(0.78 0.15 70); font-weight: 600; }
  .thinking-seconds { font-size: 11.5px; color: oklch(0.55 0.01 250); font-family: 'IBM Plex Mono', monospace; }
  .thinking-track { height: 5px; border-radius: 3px; background: oklch(0.29 0.008 250); overflow: hidden; }
  .thinking-fill { height: 100%; border-radius: 3px; background: oklch(0.75 0.14 85); width: 0%; transition: width 0.35s ease-out; }

  #input-bar { flex-shrink: 0; display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid oklch(0.29 0.008 250); }
  #input-box {
    flex: 1; background: oklch(0.14 0.006 250); border: 1px solid oklch(0.29 0.008 250);
    border-radius: 8px; padding: 11px 14px; color: inherit; font-family: inherit; font-size: 13.5px; resize: none;
  }
  #send-btn {
    background: oklch(0.75 0.14 85); color: oklch(0.16 0.02 85); border: none;
    border-radius: 8px; padding: 0 20px; font-weight: 700; font-size: 13px; cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body data-active="admin-chat">
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div class="topbar" style="position: relative;">
        <div class="topbar-title">
          <span class="ai-avatar" style="width:24px;height:24px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="7" width="16" height="13" rx="5" stroke="oklch(0.75 0.14 85)" stroke-width="1.8"/>
              <circle cx="9" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
              <circle cx="15" cy="13" r="1.4" fill="oklch(0.75 0.14 85)"/>
              <path d="M9.5 16.3 Q12 18 14.5 16.3" stroke="oklch(0.75 0.14 85)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
              <path d="M12 7 V4" stroke="oklch(0.75 0.14 85)" stroke-width="1.7" stroke-linecap="round"/>
              <circle cx="12" cy="3" r="1.2" fill="oklch(0.75 0.14 85)"/>
            </svg>
          </span>
          🔒 Admin · AI Chat
        </div>
        <div class="topbar-actions">
          <button id="clear-btn">เริ่มแชทใหม่</button>
          <button id="usage-toggle">Usage</button>
          <button id="logout">ออกจากระบบ</button>
        </div>

        <div id="usage-panel" class="card">
          <div class="usage-section-label">วันนี้</div>
          <div class="usage-row"><span class="muted">ข้อความ</span><span class="mono" id="usage-today-count">0 / 200</span></div>
          <div class="usage-row"><span class="muted">Prompt tokens</span><span class="mono" id="usage-today-input">0</span></div>
          <div class="usage-row"><span class="muted">Completion tokens</span><span class="mono" id="usage-today-output">0</span></div>

          <div class="usage-section-label">ทั้งหมด</div>
          <div class="usage-row"><span class="muted">จำนวนครั้งที่เรียก AI</span><span class="mono" id="usage-all-count">0</span></div>
          <div class="usage-row"><span class="muted">Token รวม</span><span class="mono" id="usage-all-tokens">0</span></div>

          <div class="muted" style="font-size:11px; margin-top:10px; line-height:1.6;">
            ฟรีภายในโควตา 10,000 Neurons/วันของบัญชี Cloudflare (นับ Neuron ไม่ใช่ token ตรงๆ เช็คของจริงได้ที่ Cloudflare Dashboard)
          </div>
        </div>
      </div>

      <main class="chat-main">
        <div id="messages"></div>
        <div id="input-bar">
          <textarea id="input-box" rows="1" placeholder="พิมพ์คำถาม..."></textarea>
          <button id="send-btn">ส่ง</button>
        </div>
      </main>
    </div>
  </div>

  <script src="/sidebar.js"></script>
  <script src="/admin/common.js"></script>
  <script src="/admin/chat.js"></script>
</body>
</html>
